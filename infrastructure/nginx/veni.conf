# Veni — Nginx site config (ADR-0006)
# Amazon Linux: sudo cp … /etc/nginx/conf.d/veni.conf
# Ubuntu: sites-available + sites-enabled symlink

upstream veni_gunicorn {
    server unix:/run/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name 44.203.79.250 _;

    client_max_body_size 6M;

    location ~ /\.(env|git) {
        deny all;
        return 404;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location /static/ {
        alias /var/www/veni/static/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /api/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_pass http://veni_gunicorn;
    }

    location /django-admin/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_pass http://veni_gunicorn;
    }

    root /var/www/veni/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
