# Veni — Nginx site config (ADR-0006)
# Install: sudo ln -sf /var/www/veni/repo/infrastructure/nginx/veni.conf /etc/nginx/sites-enabled/veni.conf
#
# After Certbot:
#   sudo certbot --nginx -d yourdomain.com
# Certbot adds listen 443 ssl and redirects from :80.

upstream veni_gunicorn {
    server unix:/run/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;

    # --- TLS (uncomment after certbot, or let certbot inject) ---
    # listen 443 ssl http2;
    # listen [::]:443 ssl http2;
    # ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

    client_max_body_size 6M;

    # Block sensitive paths if the web root is ever misconfigured.
    location ~ /\.(env|git) {
        deny all;
        return 404;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    # Django collected static (admin UI assets)
    location /static/ {
        alias /var/www/veni/static/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # API → Gunicorn
    location /api/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_pass http://veni_gunicorn;
    }

    # Django staff admin (not the React /admin console)
    location /django-admin/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_pass http://veni_gunicorn;
    }

    # React SPA (includes customer storefront and /admin/* admin console routes)
    root /var/www/veni/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
